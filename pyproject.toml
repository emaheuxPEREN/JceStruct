[tool.poetry]
name = "JceStruct"
version = "0.2.0"
description = "JCE Encode/Decode"
authors = ["yanyongyu <yanyongyu_1@126.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/yanyongyu/JceStruct"
repository = "https://github.com/yanyongyu/JceStruct"
documentation = "https://github.com/yanyongyu/JceStruct#readme"
keywords = ["jce"]
packages = [
    { include = "jce" }
]
include = ["jce/py.typed"]

[tool.poetry.scripts]
jce_decode = "jce.__main__:cli"

[tool.poetry.dependencies]
python = "^3.9"
pydantic = "^2"
typing-extensions = "^4"

[tool.poetry.dev-dependencies]
black = "^25"
isort = "^6"

# [[tool.poetry.source]]
# name = "aliyun"
# url = "https://mirrors.aliyun.com/pypi/simple/"
# default = true

[tool.mypy]
strict = true
pretty = true

[tool.pyright]
typeCheckingMode = "strict"
reportUnnecessaryIsInstance = false
reportUnnecessaryComparison = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false

[tool.black]
line-length = 80
extend-exclude = '''
'''

[tool.isort]
profile = "black"
line_length = 80
length_sort = true
skip_gitignore = true
force_sort_within_sections = true
extra_standard_library = "typing_extensions"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
